name    = App-perlimports
author  = Olaf Alders <olaf@wundercounter.com>
license = Perl_5
copyright_holder = Olaf Alders
copyright_year   = 2020
main_module = lib/App/perlimports.pm

[@Author::OALDERS]
MetaNoIndex.directory[] = test-data
StaticInstall.mode = on
StaticInstall.dry_run = 0
; The trailing names are explicit list-accessor subs that replaced Sub::HandlesVia
; 'Array' delegations (issue #171). The generated delegations looked imported to
; Pod::Coverage; the hand-written replacements are native to their files and
; would otherwise be flagged as undocumented.
Test::Pod::Coverage::Configurable.also_private = qr/^(?:BUILD|BUILDARGS|all_includes|possibly_imported_tokens|sub_exporter_export_list|has_at_export|has_at_export_ok|has_import_flags)$/
Test::Pod::Coverage::Configurable.trustme = App::perlimports::Role::Logger => qr/.*/
-remove = Test::Synopsis
-remove = Test::TidyAll

[PruneFiles]
match = ^author/
match = ^inc/

[GitHubREADME::Badge]
badges = github_actions/dzil-build-and-test.yml
badges = codecov
badges = cpants
badges = github_tag
badges = license
place = top
phase = build

[Prereqs / RuntimeRequires]
Class::Inspector = 1.36
File::XDG = 1.01
Log::Dispatch = 2.70
perl = 5.18.0
Perl::Tidy = 20220613
PPI = 1.276
Symbol::Get = 0.10
TOML::Tiny = 0.16

; Mostly needed for files in ./test-data
[Prereqs / TestRequires]
Test::RequiresInternet = 0
Test::Script = 1.29

[Prereqs / DevelopRequires]
Perl::Critic::Policy::ValuesAndExpressions::ProhibitAccessOfPrivateData = v1.0.0
