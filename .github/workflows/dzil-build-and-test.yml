---
name: dzil build and test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-job:
    name: Build distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by hand (Dependabot can't see these); bump the script SHA and TAG together.
      - name: Install ubi
        shell: bash
        run: curl --fail --show-error --silent --location https://raw.githubusercontent.com/houseabsolute/ubi/88c2ce36af284e675921dc00f9aafcbd49129883/bootstrap/bootstrap-ubi.sh | TAG=v0.13.0 sh
      - name: Install omegasort
        run: ubi --project houseabsolute/omegasort --tag v0.2.1 --in /usr/local/bin
      - name: Install precious
        run: ubi --project houseabsolute/precious --tag v1.0.0 --in /usr/local/bin
      - name: install test-needs deps
        run: cpm install -g --cpanfile test-needs-cpanfile
      - name: Run Tests
        env:
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
          EXTENDED_TESTING: 1
          HARNESS_OPTIONS: j2
          RELEASE_TESTING: 1
        run: auto-build-and-test-dist
      - name: Run precious
        run: precious lint --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_dir
          path: build_dir
        if: ${{ github.actor != 'nektos/act' }}
