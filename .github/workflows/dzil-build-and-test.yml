  coverage-job:
    needs: build-job
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: perldocker/perl-tester:5.42
    steps:
      # codecov wants to be inside a Git repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_dir
          path: .
      - name: install test-needs deps
        run: cpm install -g --cpanfile test-needs-cpanfile
        continue-on-error: true
      - name: Install deps and test
        run: cpan-install-dist-deps && test-dist
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          HARNESS_OPTIONS: j2
          HARNESS_PERL_SWITCHES: '-MDevel::Cover=+ignore,^local/|^t/|^xt|^test-data'
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
  test-job:
    needs: build-job
    runs-on: ${{ matrix.os }}
    # Backstop only: no job should approach this. The macOS post-suite hang
    # that used to burn the full 6h runner limit is fixed at the source (see
    # t/memoize.t, which skips loading the UUID XS module on darwin).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        perl-version:
          - '5.24'
          - '5.26'
          - '5.28'
          - '5.30'
          - '5.32'
          - '5.34'
          - '5.36'
          - '5.38'
          - '5.40'
          - '5.42'
        # macOS runners are scarce and jobs can sit in the queue until
        # cancelled, so only test the latest Perl there.
        include:
          - os: macos-latest
            perl-version: '5.42'
    name: More deps ${{ matrix.perl-version }} on ${{ matrix.os }}
    steps:
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@3b59bd33efdae98406a9bc4b75a4aa041e11993a # v1.44.4
        with:
          perl-version: ${{ matrix.perl-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_dir
          path: .
      - name: install test-needs deps
        run: cpm install -g --cpanfile test-needs-cpanfile
        continue-on-error: true
      - uses: perl-actions/setup-cpm@fffc509393becdb9b4d894af16591b7757afe94e # v1.0.1
        with:
          version: compat
      - name: install deps using cpm
        run: cpm install -g --cpanfile cpanfile --with-suggests --with-test --with-develop
      - run: prove -lr -j2 t
  without-test-needs-job:
    needs: build-job
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        perl-version:
          #- "5.12"
          #- "5.14"
          #- "5.16"
          #- "5.18"
          #- "5.20"
          #- "5.22"
          #- "5.24"
          #- "5.26"
          #- "5.28"
          #- "5.30"
          #- "5.32"
          # - "5.34"
          # - '5.38'
          - '5.40'
    name: Fewer deps ${{ matrix.perl-version }} on ${{ matrix.os }}
    steps:
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@3b59bd33efdae98406a9bc4b75a4aa041e11993a # v1.44.4
        with:
          perl-version: ${{ matrix.perl-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_dir
          path: .
      - uses: perl-actions/setup-cpm@fffc509393becdb9b4d894af16591b7757afe94e # v1.0.1
        with:
          version: compat
      - name: install deps using cpm
        run: cpm install -g --cpanfile cpanfile --with-test
      - run: prove -lr -j2 t
